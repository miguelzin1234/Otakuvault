<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>OtakuVault</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OtakuVault">
<link rel="manifest" href="manifest.json" id="mf">
<link rel="icon" href="icone.jpg" type="image/jpeg">
<link rel="apple-touch-icon" href="icone.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  --bg:#05070d; --bg2:#0a1020; --card:#0c1426; --card2:#111c33;
  --line:rgba(70,160,255,.18); --neon:#2ea8ff; --neon2:#00e5ff;
  --text:#e9f2ff; --muted:#8ea3c7; --danger:#ff5d7a;
  --glow:0 0 0 1px rgba(46,168,255,.35),0 0 28px rgba(46,168,255,.35);
  --display:'Chakra Petch','Trebuchet MS',system-ui,sans-serif;
  --body:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(900px 500px at 15% -10%,rgba(46,168,255,.16),transparent 60%),radial-gradient(700px 500px at 100% 10%,rgba(0,229,255,.08),transparent 60%);
  background-attachment:fixed;padding-bottom:120px;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.2px}
:focus-visible{outline:2px solid var(--neon2);outline-offset:2px;border-radius:10px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--bg) 40%,rgba(5,7,13,0));padding:12px 0 14px}
.top .wrap{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px}
.logo svg{filter:drop-shadow(0 0 8px rgba(46,168,255,.8))}
.logo b{background:linear-gradient(90deg,#fff,var(--neon2));-webkit-background-clip:text;background-clip:text;color:transparent}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:linear-gradient(135deg,var(--neon),#6a5cff);box-shadow:var(--glow)}

/* pages */
#view{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pg h1{font-size:28px;margin:6px 0 14px}
.sub{color:var(--muted);margin:-8px 0 14px}

/* search & chips */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 14px;height:50px;transition:.2s}
.search:focus-within{border-color:var(--neon);box-shadow:var(--glow)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0;height:100%}
.search input::placeholder{color:#5d7096}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:14px;transition:.2s;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,rgba(46,168,255,.28),rgba(0,229,255,.12));border-color:var(--neon);color:#fff;box-shadow:0 0 18px rgba(46,168,255,.25)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:10px 0}
.seg button{padding:7px 14px;border-radius:10px;color:var(--muted);font-size:14px;transition:.2s}
.seg button.on{background:var(--card2);color:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.count{color:var(--muted);font-size:13px;margin:6px 2px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
select.sort{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px;color:var(--text)}

/* grid & cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}}
.card{position:relative;border-radius:24px;overflow:hidden;background:var(--card);cursor:pointer;
  box-shadow:0 14px 30px rgba(0,0,0,.55),0 0 0 1px var(--line);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
@media(hover:hover){.card:hover{transform:translateY(-5px);box-shadow:0 20px 40px rgba(0,0,0,.6),0 0 0 1px var(--neon),0 0 30px rgba(46,168,255,.28)}}
.card:active{transform:scale(.985)}
.cv{position:relative;aspect-ratio:2/3;background:var(--card2)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(3,5,10,.96) 0%,rgba(3,5,10,.55) 38%,rgba(3,5,10,0) 62%)}
.st{position:absolute;z-index:2;left:10px;top:10px;font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:999px;background:rgba(5,7,13,.72);backdrop-filter:blur(8px);border:1px solid currentColor}
.fav{position:absolute;z-index:2;right:8px;top:8px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(5,7,13,.65);backdrop-filter:blur(8px);color:#a4b4d4;font-size:17px;transition:.2s}
.fav.on{color:#ff4d79;box-shadow:0 0 16px rgba(255,77,121,.55);animation:pop .35s}
@keyframes pop{40%{transform:scale(1.35)}}
.ov{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:12px 13px 13px}
.ov h3{font-size:15px;line-height:1.2;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:#b6c6e6;display:flex;justify-content:space-between;gap:6px}
.rate{color:#ffd35c;font-weight:600}
.rate.zero{color:#6d7fa3;font-weight:400}
.pbar{position:absolute;z-index:3;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.1)}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--neon),var(--neon2));box-shadow:0 0 10px var(--neon)}

/* rows */
.row{margin:26px 0}
.rh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.rh h2{font-size:20px}
.rh span{color:var(--muted);font-size:13px}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 18px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:none;width:152px;scroll-snap-align:start}
@media(min-width:700px){.rail .card{width:184px}}

/* hero */
.hero{position:relative;border-radius:30px;overflow:hidden;padding:20px;margin:6px 0 4px;border:1px solid var(--line);
  box-shadow:0 0 0 1px rgba(46,168,255,.12),0 24px 60px rgba(0,0,0,.6),0 0 70px rgba(46,168,255,.14);isolation:isolate}
.hero .bgimg{position:absolute;inset:-20px;z-index:-2;background-size:cover;background-position:center;filter:blur(28px) saturate(1.4);opacity:.55}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,rgba(5,7,13,.92),rgba(5,7,13,.4))}
.hero .in{display:flex;gap:18px;align-items:flex-end}
.hero img{width:118px;border-radius:18px;aspect-ratio:2/3;object-fit:cover;box-shadow:0 14px 34px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.12);flex:none}
@media(min-width:700px){.hero{padding:30px}.hero img{width:180px}.hero h2{font-size:34px!important}}
.hero small{color:var(--neon2);font-weight:600;font-size:13px}
.hero h2{font-size:24px;margin:4px 0 6px;line-height:1.1}
.hero p{margin:0 0 12px;color:#c3d1ee;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:520px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:14px;font-weight:600;background:linear-gradient(135deg,var(--neon),#5a78ff);color:#fff;box-shadow:0 8px 24px rgba(46,168,255,.35);transition:.2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card2);box-shadow:inset 0 0 0 1px var(--line);color:var(--text)}
.btn.danger{background:rgba(255,93,122,.14);color:#ff8fa5;box-shadow:inset 0 0 0 1px rgba(255,93,122,.4)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tags span{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(46,168,255,.12);color:#9fd2ff}

/* empty */
.empty{text-align:center;padding:46px 20px;border:1px dashed var(--line);border-radius:26px;color:var(--muted);background:rgba(12,20,38,.5)}
.empty .big{font-size:42px;margin-bottom:8px}
.empty p{margin:0 0 16px}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 12px env(safe-area-inset-bottom,0px);pointer-events:none}
.pill{pointer-events:auto;max-width:560px;margin:0 auto 10px;display:grid;grid-template-columns:1fr 1fr 62px 1fr 1fr 1fr;align-items:center;gap:2px;padding:7px;border-radius:26px;
  background:rgba(10,16,32,.82);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 18px 40px rgba(0,0,0,.65),0 0 0 1px var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:19px;color:var(--muted);font-size:11.5px;transition:.25s}
.tab .ic{font-size:21px;filter:grayscale(1) opacity(.7);transition:.25s}
.tab.on{color:#fff;background:linear-gradient(180deg,rgba(46,168,255,.28),rgba(46,168,255,.06));box-shadow:inset 0 0 0 1px rgba(46,168,255,.5),0 0 22px rgba(46,168,255,.3)}
.tab.on .ic{filter:none;transform:translateY(-1px) scale(1.08)}

/* sheet */
.ovl{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,4,9,.72);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
.ovl.open{opacity:1;pointer-events:auto}
.panel{width:100%;max-width:860px;max-height:92vh;overflow-y:auto;background:linear-gradient(180deg,#0f1930,#091020);border-radius:30px 30px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -10px 60px rgba(46,168,255,.18),0 0 0 1px var(--line);transform:translateY(40px);transition:transform .35s cubic-bezier(.2,.9,.2,1)}
.ovl.open .panel{transform:none}
@media(min-width:760px){.ovl{align-items:center}.panel{border-radius:30px;padding:26px}}
.grab{width:44px;height:4px;border-radius:4px;background:#2a3a5e;margin:-6px auto 14px}
@media(min-width:760px){.grab{display:none}}
.sh{display:flex;gap:16px}
.sh img{width:120px;aspect-ratio:2/3;object-fit:cover;border-radius:18px;flex:none;box-shadow:0 12px 30px rgba(0,0,0,.6),0 0 0 1px var(--line)}
@media(min-width:760px){.sh img{width:200px}}
.sh h2{font-size:24px;line-height:1.1}
.sh .alt{color:var(--muted);font-size:13px;margin:2px 0 6px}
.facts{color:#b6c6e6;font-size:14px;margin:6px 0}
.syn{color:#cbd8f1;margin:12px 0 4px}
.lab{font-family:var(--display);font-weight:600;margin:20px 0 8px;font-size:15px;color:#cfe3ff}
.stg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.stg{grid-template-columns:repeat(4,1fr)}}
.sbtn{padding:12px 8px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:14px;transition:.2s}
.sbtn.on{border-color:currentColor;box-shadow:0 0 20px -4px currentColor;background:rgba(255,255,255,.04);font-weight:600}
.stars{display:flex;gap:2px;flex-wrap:nowrap}
.stars button{font-size:25px;line-height:1;color:#2a3a5e;padding:4px 1px;transition:.15s}
.stars button.on{color:#ffd35c;text-shadow:0 0 12px rgba(255,211,92,.6)}
@media(max-width:380px){.stars button{font-size:22px}}
.rnum{font-family:var(--display);color:#ffd35c;margin-left:8px;font-size:18px;align-self:center}
.prog{display:flex;align-items:center;gap:10px}
.prog input[type=range]{flex:1;accent-color:var(--neon);height:28px}
.step{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px}
.ptxt{min-width:92px;text-align:right;font-family:var(--display)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.xbtn{position:absolute;right:14px;top:14px}
.panel{position:relative}
.dlg{max-width:520px}
.dlg textarea{width:100%;min-height:150px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;resize:vertical;outline:0;font-size:13px}
.dlg textarea:focus{border-color:var(--neon)}

/* profile */
.pf{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.pf .av{width:62px;height:62px;font-size:26px}
.pf input{background:none;border:0;border-bottom:1px dashed var(--line);font-family:var(--display);font-size:22px;font-weight:600;width:100%;max-width:240px;outline:0;padding:2px 0}
.pf input:focus{border-color:var(--neon)}
.pf small{color:var(--neon2)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:linear-gradient(160deg,var(--card2),var(--card));border-radius:22px;padding:16px;box-shadow:0 0 0 1px var(--line)}
.tile b{display:block;font-family:var(--display);font-size:30px;line-height:1.1}
.tile span{color:var(--muted);font-size:13px}
.two{display:grid;gap:12px;margin-top:12px}
@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.box{background:linear-gradient(160deg,var(--card2),var(--card));border-radius:24px;padding:18px;box-shadow:0 0 0 1px var(--line)}
.box h3{font-size:16px;margin-bottom:12px}
.ringw{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:26px;font-weight:700}
.favbox{display:flex;gap:14px;align-items:center}
.favbox img{width:74px;aspect-ratio:2/3;object-fit:cover;border-radius:14px;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.bar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13.5px}
.bar .n{width:110px;flex:none;color:#c3d1ee}
.bar .t{flex:1;height:9px;border-radius:9px;background:#0a1224;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:9px;transition:width .6s cubic-bezier(.2,.9,.2,1)}
.bar .v{width:28px;text-align:right;color:var(--muted)}
.note{color:var(--muted);font-size:13px;margin:6px 0 12px}
.row2{display:flex;gap:8px;flex-wrap:wrap}

/* adicionar */
.form{display:grid;gap:22px}
@media(min-width:760px){.form{grid-template-columns:240px 1fr;align-items:start}}
.fcol{max-width:220px;margin:0 auto;width:100%}
@media(min-width:760px){.fcol{max-width:none;margin:0}}
.cvprev{aspect-ratio:2/3;border-radius:24px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.6),0 0 0 1px var(--line)}
.cvprev img{width:100%;height:100%;object-fit:cover;display:block}
.fl{display:block;color:#cfe3ff;font-weight:500;font-size:14px;margin-bottom:14px}
.fi{display:block;width:100%;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:0;transition:.2s}
.fi:focus{border-color:var(--neon);box-shadow:var(--glow)}
textarea.fi{resize:vertical;min-height:84px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wrapc{flex-wrap:wrap;overflow:visible;margin-bottom:12px;padding-top:2px}
.fab{width:54px;height:54px;border-radius:50%;margin:-24px auto 0;font-size:34px;line-height:1;font-weight:300;color:#fff;background:linear-gradient(135deg,var(--neon),#5a78ff);box-shadow:0 0 0 5px rgba(10,16,32,.92),0 10px 28px rgba(46,168,255,.55);transition:transform .3s,background .3s}
.fab.on{transform:rotate(45deg);background:linear-gradient(135deg,var(--neon2),var(--neon))}
@media(max-width:420px){.tab{font-size:10px}.pill{padding:6px 4px}}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#0f1a33;border-radius:14px;padding:11px 16px;box-shadow:0 0 0 1px var(--neon),0 12px 30px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s;z-index:80;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* login */
#auth{position:fixed;inset:0;z-index:90;display:none;overflow-y:auto;background:var(--bg);
  background-image:radial-gradient(900px 520px at 10% -10%,rgba(46,168,255,.24),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(0,229,255,.12),transparent 60%);
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px))}
#auth.open{display:block;animation:fade .3s ease both}
.aw{max-width:420px;margin:0 auto}
.alogo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:24px;margin:8px 0 28px}
.alogo svg{filter:drop-shadow(0 0 10px rgba(46,168,255,.9))}
.aw h1{font-size:30px;margin-bottom:6px}
.aw .seg{display:flex;margin:14px 0 8px}
.aw .seg button{flex:1;padding:10px}
.aerr{min-height:22px;margin:4px 2px 10px;color:#ff8fa5;font-size:14px}
.aerr.ok{color:#3dffa5}
.anote{background:rgba(255,200,87,.1);border:1px solid rgba(255,200,87,.35);color:#ffd98a;border-radius:14px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.wide{width:100%}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.link{color:var(--neon2);font-weight:500;padding:6px 2px;font-size:14px}
.link.center{display:block;margin:8px auto 0;text-align:center}
.link.dim{color:var(--muted);font-size:13px}
.pw{position:relative}
.pw .fi{padding-right:48px}
.pw button{position:absolute;right:4px;top:6px;padding:9px;color:var(--muted)}
.sw{text-align:center;color:var(--muted);margin:18px 0 0}
.splash{display:grid;place-items:center;min-height:80vh;text-align:center;color:var(--muted)}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(46,168,255,.2);border-top-color:var(--neon);animation:sp 1s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
#auth.busy .btn{opacity:.55;pointer-events:none}
#dlgo{z-index:100}
#toast{z-index:120}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="logo">
    <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 28 9v14L16 30 4 23V9z" fill="#0a1226" stroke="#2ea8ff" stroke-width="1.8"/><path d="M16 9v7m0 0 6 3.5M16 16l-6 3.5" stroke="#00e5ff" stroke-width="1.8" stroke-linecap="round"/></svg>
    <b>OtakuVault</b>
  </div>
  <button class="av" id="hav" data-a="tab" data-v="profile" aria-label="Abrir perfil">O</button>
</div></header>

<main class="wrap" id="view"></main>

<nav class="dock" aria-label="Navegação principal"><div class="pill" id="tabs"></div></nav>
<div id="auth" role="dialog" aria-modal="true" aria-label="Entrar no OtakuVault"></div>
<div class="ovl" id="sheet" role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>
<div class="ovl" id="dlgo" role="dialog" aria-modal="true"><div class="panel dlg" id="dlg"></div></div>
<div id="toast" role="status"></div>

<script>
/* ============================================================
   FIREBASE: cole aqui a configuração do seu projeto.
   Console do Firebase > Configurações do projeto > Seus apps > Web.
   Deixe os campos vazios para usar o app sem login.

function applyState(o){
  for(let i=ANIMES.length-1;i>=0;i--)if(ANIMES[i].custom){delete byId[ANIMES[i].id];ANIMES.splice(i,1)}
  S={name:o.name||'',items:o.items||{},custom:Array.isArray(o.custom)?o.custom:[],nid:o.nid||1000};
  S.custom.forEach(c=>{if(c&&c.id&&!byId[c.id]){ANIMES.push(c);byId[c.id]=c}});
  S.nid=Math.max(S.nid,...S.custom.map(c=>c.id),1000);
  save();
}
const it=id=>S.items[id]||{};
let nudged=false;
function upd(id,patch){
  if(!nudged&&!U&&isGuest()&&getCfg()){nudged=true;setTimeout(()=>toast('Para não perder seus animes, crie uma conta no Perfil.'),2400)}
  const cur=Object.assign({},S.items[id]||{},patch,{u:Date.now()});
  if(!cur.st&&!cur.f&&!cur.r&&!cur.p&&!cur.c)delete S.items[id];else S.items[id]=cur;
  save();
}
function setStatus(id,st){
  const a=byId[id],i=it(id);
  if(i.st===st){upd(id,{st:''});return}
  const patch={st};
  if(st==='watched')patch.p=a.eps;
  if(st==='planned')patch.p=0;
  upd(id,patch);
}
function setRate(id,n){if(it(id).r===n)n=0;upd(id,{r:n})}
function setProg(id,p){
  const a=byId[id],i=it(id);p=Math.max(0,Math.min(a.eps,p|0));
  const patch={p};
  if(p>=a.eps)patch.st='watched';
  else if(p>0&&(!i.st||i.st==='planned'||i.st==='watched'))patch.st='watching';
  upd(id,patch);
}

const covers={};
function wrapT(t,max){
  const words=t.split(' '),lines=[];let cur='';
  words.forEach(w=>{
    while(w.length>max){if(cur){lines.push(cur);cur=''}lines.push(w.slice(0,max));w=w.slice(max)}
    if((cur+' '+w).trim().length>max){lines.push(cur);cur=w}else cur=(cur+' '+w).trim();
  });
  if(cur)lines.push(cur);
  return lines;
}
function mkCover(a){
  const h=a.h,id=a.id,m=id%5,W=300,H=450;
  const R=n=>((id*9301+n*49297)%233280)/233280;
  const c1=`hsl(${h},88%,44%)`,c2=`hsl(${(h+45)%360},80%,12%)`,c3=`hsl(${(h+330)%360},100%,68%)`;
  let d='';
  if(m===0){for(let k=0;k<6;k++){const x=-60+k*62+R(k)*26;d+=`<polygon points="${x},0 ${x+30},0 ${x-110},${H} ${x-140},${H}" fill="${c3}" opacity="${(.07+k*.025).toFixed(2)}"/>`}d+=`<circle cx="215" cy="120" r="46" fill="${c3}" opacity=".5"/>`}
  else if(m===1){for(let r=40;r<260;r+=34)d+=`<circle cx="210" cy="130" r="${r}" fill="none" stroke="${c3}" stroke-width="2" opacity="${(.34-r/900).toFixed(2)}"/>`;d+=`<circle cx="210" cy="130" r="34" fill="${c3}" opacity=".55"/>`}
  else if(m===2){for(let k=0;k<16;k++){const ang=Math.PI*(1+k/15);d+=`<line x1="150" y1="330" x2="${150+520*Math.cos(ang)}" y2="${330+520*Math.sin(ang)}" stroke="${c3}" stroke-width="${6+R(k)*12}" opacity="${(.08+R(k+3)*.12).toFixed(2)}"/>`}d+=`<circle cx="150" cy="300" r="52" fill="${c3}" opacity=".55"/>`}
  else if(m===3){for(let y=0;y<9;y++)for(let x=0;x<6;x++)d+=`<circle cx="${28+x*48}" cy="${34+y*30}" r="${(1.5+R(x*9+y)*3).toFixed(1)}" fill="${c3}" opacity=".35"/>`;d+=`<circle cx="95" cy="150" r="64" fill="${c3}" opacity=".4"/>`}
  else{d+=`<circle cx="150" cy="170" r="108" fill="none" stroke="${c3}" stroke-width="14" opacity=".4"/>`;for(let y=40;y<H;y+=44)d+=`<rect x="0" y="${y}" width="${W}" height="14" fill="${c3}" opacity=".06"/>`;d+=`<circle cx="150" cy="170" r="40" fill="${c3}" opacity=".5"/>`}
  const long=a.t.length>26;
  const size=long?23:(a.t.length>14?29:34),max=Math.floor(262/(size*.6));
  const lines=wrapT(a.t,max).slice(0,4),lh=size*1.12;
  let y0=H-34-(lines.length-1)*lh;
  const txt=lines.map((l,i)=>`<text x="22" y="${(y0+i*lh).toFixed(0)}" font-size="${size}" font-weight="900" fill="#fff" font-family="Arial Black,Impact,Arial,sans-serif" stroke="rgba(0,0,0,.35)" stroke-width="1">${esc(l)}</text>`).join('');
  const mono=esc(a.t.replace(/^(The|A) /,'').charAt(0).toUpperCase());
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".65"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#g)"/>${d}<text x="${W/2}" y="${(H*0.64).toFixed(0)}" text-anchor="middle" font-size="270" font-weight="900" font-family="Arial Black,Impact,Arial,sans-serif" fill="#fff" opacity=".2">${mono}</text><rect width="${W}" height="${H}" fill="url(#b)"/><text x="22" y="34" font-size="13" font-weight="700" fill="#fff" opacity=".8" font-family="Arial,sans-serif" letter-spacing="2">${a.y||''}</text><rect x="22" y="42" width="34" height="3" fill="${c3}"/></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function cover(a){const c=it(a.id).c;if(c)return c;return covers[a.id]||(covers[a.id]=mkCover(a))}

function card(a){
  const i=it(a.id),st=i.st?STATUS[i.st]:null,p=prog(a.id);
  return `<article class="card" data-a="open" data-v="${a.id}" tabindex="0" aria-label="${esc(a.t)}">
    <div class="cv"><img loading="lazy" src="${cover(a)}" alt="Capa de ${esc(a.t)}">
      ${st?`<span class="st" style="color:${st.c}">${st.e} ${st.l}</span>`:''}
      <button class="fav ${i.f?'on':''}" data-a="fav" data-v="${a.id}" aria-label="Favoritar ${esc(a.t)}" aria-pressed="${!!i.f}">${i.f?'♥':'♡'}</button>
      <div class="ov"><h3>${esc(a.t)}</h3>
        <div class="meta"><span>${a.eps} ep · ${yr(a)}</span><span class="rate ${i.r?'':'zero'}">★ ${i.r||0}/10</span></div>
      </div>
      ${i.st==='watching'&&p>0?`<div class="pbar"><i style="width:${Math.min(100,p/a.eps*100)}%"></i></div>`:''}
    </div></article>`;

const grid=l=>l.length?`<div class="grid">${l.map(card).join('')}</div>`:'';
const rail=(title,sub,l)=>l.length?`<section class="row"><div class="rh"><h2>${title}</h2><span>${sub||''}</span></div><div class="rail">${l.map(card).join('')}</div></section>`:'';
function empty(ico,msg,btn){return `<div class="empty"><div class="big">${ico}</div><p>${msg}</p>${btn||''}</div>`}
const dayN=Math.floor(Date.now()/864e5);
function rot(arr,n){if(!arr.length)return arr;n=n%arr.length;return arr.slice(n).concat(arr.slice(0,n))}

const GENRES=(()=>{const c={};ANIMES.forEach(a=>a.g.forEach(g=>c[g]=(c[g]||0)+1));return Object.keys(c).sort((x,y)=>c[y]-c[x])})();

function matches(a,q,g,type){
  if(g&&g!=='Todos'&&!a.g.includes(g))return false;
  if(type==='F'&&a.tag!=='F')return false;
  if(type==='G'&&a.tag!=='G')return false;
  if(type==='C'&&!a.custom)return false;
  if(!q)return true;
  const hay=norm([a.t,a.alt,a.g.join(' '),a.y||''].join(' '));
  return norm(q).split(/\s+/).every(w=>hay.includes(w));
}

function stats(){
  const all=Object.keys(S.items).map(id=>({a:byId[id],v:S.items[id]})).filter(x=>x.a);
  const watched=all.filter(x=>x.v.st==='watched');
  const rated=all.filter(x=>x.v.r>0);
  const avg=rated.length?rated.reduce((s,x)=>s+x.v.r,0)/rated.length:0;
  const favs=all.filter(x=>x.v.f);
  const pickFrom=favs.length?favs:rated;
  const top=pickFrom.slice().sort((x,y)=>(y.v.r||0)-(x.v.r||0)||(y.v.u||0)-(x.v.u||0))[0];
  const eps=all.reduce((s,x)=>s+(x.v.st==='watched'&&x.v.p==null?x.a.eps:(x.v.p||0)),0);
  const by={};ORDER.forEach(k=>by[k]=all.filter(x=>x.v.st===k).length);
  return{watched:watched.length,avg,top,eps,by,rated:rated.length,favs:favs.length};
}

        <div><b style="font-family:var(--display);font-size:18px">${s.watched} de ${total}</b><div class="note">animes da sua coleção já assistidos</div></div></div></div>

function readCover(file,cb){
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{
    const w=Math.min(420,im.width),h=Math.round(im.height*w/im.width),cv=document.createElement('canvas');cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(im,0,0,w,h);cb(cv.toDataURL('image/jpeg',.82))};
    im.onerror=()=>toast('Não foi possível ler essa imagem');im.src=rd.result};
  rd.readAsDataURL(file);
}
function saveCustom(){
  const f=UI.form,t=f.t.trim(),eps=parseInt(f.eps,10),y=parseInt(f.y,10)||0;
  if(!t)return toast('Digite o nome do anime.');
  if(!(eps>=1&&eps<=5000))return toast('Informe os episódios (de 1 a 5000).');
  if(y&&(y<1900||y>2100))return toast('Ano inválido.');
  const dup=ANIMES.find(a=>norm(a.t)===norm(t)&&a.id!==UI.edit);
  if(dup){toast('Esse anime já existe na sua coleção.');openSheet(dup.id);return}
  const s=f.s.trim()||DEFSYN;
  if(UI.edit){
    const a=byId[UI.edit];
    Object.assign(a,{t,eps,y,g:f.g.slice(),s,h:hue(t)});
    delete covers[a.id];
    upd(a.id,{c:f.c});
    if((it(a.id).p||0)>eps)upd(a.id,{p:eps});
    save();
    UI.edit=null;UI.form=blankForm();go('list');toast('Alterações salvas');return;
  }
  const id=++S.nid;
  const a={id,t,eps,y,g:f.g.slice(),h:hue(t),tag:'C',s,alt:'',custom:true};
  ANIMES.push(a);byId[id]=a;S.custom.push(a);
  const patch={st:f.st};if(f.st==='watched')patch.p=eps;if(f.c)patch.c=f.c;
  upd(id,patch);
  UI.form=blankForm();UI.lf='all';
  go('list');toast('Anime adicionado à sua lista');
}
function openEdit(id){
  const a=byId[id];if(!a)return;
  UI.edit=id;
  UI.form={t:a.t,eps:String(a.eps),y:a.y?String(a.y):'',g:a.g.slice(),s:a.s===DEFSYN?'':a.s,st:it(id).st||'planned',c:it(id).c||''};
  go('add');
}

const FB_VER='10.12.2';
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Não foi possível carregar o Firebase neste ambiente.'));document.head.appendChild(s)})}
async function cloud(fn){
  try{
    if(!getCfg()){toast('Configure o Firebase primeiro.');return}
    await fn(await getFB());
  }catch(err){toast(errMsg(err))}
}

const AUTH={mode:'in',email:'',name:'',loading:false,note:'',fromApp:false};
let fbReady=null,authObs=false,pendingCloud=null;
function getCfg(){
  if(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId)return FIREBASE_CONFIG;
  try{return JSON.parse(localStorage.getItem(FBKEY)||'null')}catch(e){return null}
}
function getFB(){
  if(fbReady)return fbReady;
  fbReady=(async()=>{
    const cfg=getCfg();if(!cfg)throw new Error('nocfg');
    if(!window.firebase){for(const m of['app','auth','firestore'])await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}-compat.js`)}
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    return firebase;
  })();
  fbReady.catch(()=>{fbReady=null});
  return fbReady;
}

function errMsg(err){
  if(!err)return 'Erro desconhecido.';
  if(err.message==='nocfg')return 'Firebase ainda não configurado. Toque em "Configurar Firebase".';
  if(err.code&&AERR[err.code])return AERR[err.code];
  return err.message||'Erro ao falar com a nuvem.';
}
const authOpen=()=>$('#auth').classList.contains('open');
const ACCT='otakuvault.acct',LASTUID='otakuvault.lastuid';
const hasAcct=()=>{try{return localStorage.getItem(ACCT)==='1'}catch(e){return false}};
const lastUid=()=>{try{return localStorage.getItem(LASTUID)}catch(e){return null}};
function setLast(){try{localStorage.setItem(LASTUID,U.uid)}catch(e){}}
function mergeState(a,b){
  const items=Object.assign({},b.items||{});
  for(const id in (a.items||{})){const x=a.items[id],y=items[id];if(!y||(x.u||0)>=(y.u||0))items[id]=x}
  const cm={};[].concat(b.custom||[],a.custom||[]).forEach(c=>{cm[c.id]=c});
  return{name:a.name||b.name||'',items,custom:Object.values(cm),nid:Math.max(a.nid||1000,b.nid||1000)};
}
function isGuest(){try{return localStorage.getItem(GUEST)==='1'}catch(e){return false}}

function aerr(m,ok){const el=$('#aerr');if(el){el.textContent=m;el.className='aerr'+(ok?' ok':'')}}
function busy(b){const a=$('#auth');if(b)a.classList.add('busy');else a.classList.remove('busy')}
function renderAuth(){
  const up=AUTH.mode==='up',cfg=!!getCfg();
  const logo=`<div class="alogo"><svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 28 9v14L16 30 4 23V9z" fill="#0a1226" stroke="#2ea8ff" stroke-width="1.8"/><path d="M16 9v7m0 0 6 3.5M16 16l-6 3.5" stroke="#00e5ff" stroke-width="1.8" stroke-linecap="round"/></svg><span>OtakuVault</span></div>`;

    ${up?`<label class="fl">Confirmar senha<input class="fi" id="a_pass2" type="password" autocomplete="new-password" placeholder="Repita a senha"></label>`:`<button class="link" data-a="forgot" style="margin:-6px 0 12px">Esqueci minha senha</button>`}
    <button class="btn wide" data-a="authgo">${up?'Criar conta':'Entrar'}</button>

async function authGo(){
  const up=AUTH.mode==='up',em=($('#a_email').value||'').trim(),pw=$('#a_pass').value||'';
  AUTH.email=em;
  if(!em||!pw)return aerr('Preencha e-mail e senha.');
  let nm='';
  if(up){
    nm=($('#a_name').value||'').trim();AUTH.name=nm;
    if(pw.length<6)return aerr('A senha precisa ter pelo menos 6 caracteres.');
    if(pw!==$('#a_pass2').value)return aerr('As senhas não conferem.');
  }
  aerr('');busy(true);
  try{
    const fb=await getFB();
    if(up){
      const r=await fb.auth().createUserWithEmailAndPassword(em,pw);
      if(nm){try{await r.user.updateProfile({displayName:nm})}catch(e){}if(!S.name){S.name=nm;save()}}
    }else await fb.auth().signInWithEmailAndPassword(em,pw);
  }catch(err){aerr(errMsg(err))}
  busy(false);
}
async function authGoogle(){
  aerr('');busy(true);
  try{
    const fb=await getFB(),prov=new fb.auth.GoogleAuthProvider();
    try{await fb.auth().signInWithPopup(prov)}
    catch(err){if(err&&err.code==='auth/popup-blocked'){await fb.auth().signInWithRedirect(prov);return}throw err}
  }catch(err){aerr(errMsg(err))}
  busy(false);
}
async function authForgot(){
  const em=($('#a_email').value||'').trim();AUTH.email=em;
  if(!em)return aerr('Digite seu e-mail acima para receber o link de redefinição.');
  busy(true);
  try{const fb=await getFB();await fb.auth().sendPasswordResetEmail(em);aerr('Enviamos um link de redefinição para '+em+'. Confira também o spam.',true)}
  catch(err){aerr(errMsg(err))}
  busy(false);
}
function schedulePush(){clearTimeout(pushT);pushT=setTimeout(()=>{pushNow().catch(()=>{})},1500)}
async function pushNow(){
  if(!U)return;
  await firebase.firestore().collection('otakuvault').doc(U.uid).set({data:JSON.stringify(S),updated:Date.now()});
}
async function syncDown(known){
  try{
    const d=await firebase.firestore().collection('otakuvault').doc(U.uid).get();
    const hasLocal=Object.keys(S.items).length>0||S.custom.length>0;
    if(!d.exists){syncOn=true;if(hasLocal)await pushNow();toast('Conectado. Sua coleção agora é salva na nuvem.');return}
    const o=JSON.parse(d.data().data);
    const hasRemote=Object.keys(o.items||{}).length>0||(o.custom||[]).length>0;
    if(!hasLocal&&hasRemote){applyState(Object.assign({name:S.name},o));syncOn=true;renderView(true);toast('Coleção restaurada da nuvem');return}
    if(!hasRemote){syncOn=true;if(hasLocal)await pushNow();toast('Conectado');return}
    if(JSON.stringify(o.items)===JSON.stringify(S.items)&&(o.custom||[]).length===S.custom.length){syncOn=true;toast('Conectado');return}
    if(known){applyState(mergeState(S,o));syncOn=true;await pushNow();renderView(true);toast('Coleção sincronizada');return}
    pendingCloud=Object.assign({name:S.name},o);
    showDlg(`<div class="lab" style="margin-top:0">Qual coleção você quer usar?</div><div class="note">Encontramos uma coleção salva nesta conta e também dados neste aparelho. Escolha qual manter. A outra será substituída.</div><div class="acts"><button class="btn" data-a="usecloud">Usar a da nuvem</button><button class="btn ghost" data-a="keeplocal">Manter deste aparelho</button></div>`);
  }catch(err){toast('Conectado, mas não consegui sincronizar agora.')}
}
async function onUser(user){
  const known=lastUid()===user.uid;
  U=user;syncOn=false;
  try{localStorage.removeItem(GUEST);localStorage.setItem(ACCT,'1')}catch(e){}
  hideAuth();
  if(!S.name&&user.displayName){S.name=user.displayName;save()}
  renderView(true);
  await syncDown(known);
  if(syncOn)setLast();
}
async function initAuth(){
  if(!getCfg()){if(!isGuest())showAuth();return}
  if(!isGuest()){AUTH.loading=true;showAuth()}
  try{
    const fb=await getFB();
    if(authObs)return;authObs=true;
    fb.auth().onAuthStateChanged(user=>{
      AUTH.loading=false;
      if(user)onUser(user);
      else{U=null;syncOn=false;if(isGuest())hideAuth();else showAuth();renderView(true)}
    });
  }catch(err){
    AUTH.loading=false;
    if(isGuest()||hasAcct())hideAuth();
    else showAuth('Não foi possível conectar ao Firebase agora. Você pode continuar sem conta e entrar depois.');
  }
}
function cloudBox(){
  if(U)return `<div class="note">Conectado como <b>${esc(U.displayName||U.email||'sua conta')}</b>. Sua coleção é salva na nuvem automaticamente.</div><div class="row2"><button class="btn ghost" data-a="fbsave">Sincronizar agora</button><button class="btn ghost" data-a="fbload">Baixar da nuvem</button><button class="btn danger" data-a="fblogout">Sair</button></div>`;
  const cfg=!!getCfg();
  return `<div class="note">${cfg?'Você está sem conta: seus animes ficam só neste aparelho e somem se você desinstalar o app. Crie uma conta para guardar tudo na nuvem e recuperar em qualquer aparelho.':cloudText()}</div><div class="row2">${cfg?'<button class="btn" data-a="showauth">Criar conta</button><button class="btn ghost" data-a="showauthin">Já tenho conta</button>':'<button class="btn ghost" data-a="fbcfg">Configurar Firebase</button>'}</div>`;
}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id&&e.target.id.indexOf('a_')===0){e.preventDefault();authGo()}});
